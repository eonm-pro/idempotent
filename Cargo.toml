[package]
name = "memorun"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "memorun"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
