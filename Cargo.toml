[package]
name = "memorun"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "memorun"
path = "src/main.rs"

[dependencies]
clap       = { version = "=4.4.18", features = ["derive"] }
rusqlite   = { version = "=0.31.0", features = ["bundled"] }
sha2       = "=0.10.8"
crossbeam-channel = "=0.5.11"
thiserror  = "=1.0.50"
